# Portfolio site — static file serving.
# See decisions/0004-docker-multistage-nginx.md
#
# HEADER INHERITANCE WARNING: nginx only inherits add_header into a location
# that defines no add_header of its own. Every location below that sets
# Cache-Control must therefore also `include security-headers.conf`, or it
# silently serves responses with no security headers at all.

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    charset      utf-8;
    server_tokens off;

    # ── Real client IPs ──────────────────────────────────────────────────────
    # Requests arrive from the ngrok container on the compose network, so without
    # this every access-log line shows the tunnel's address, not the visitor's.
    # Trust only RFC1918 ranges — never a public address.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header   X-Forwarded-For;
    real_ip_recursive on;

    # ── Compression ──────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;
    # woff2 is already compressed — re-compressing burns CPU for nothing.

    include /etc/nginx/snippets/security-headers.conf;

    # ── Health check ─────────────────────────────────────────────────────────
    # Used by the container HEALTHCHECK and compose's depends_on condition.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # ── Long-lived assets ────────────────────────────────────────────────────
    # Astro content-hashes everything under /_astro/, so these are safe to cache
    # forever: any change produces a new filename.
    #
    # Cache-Control is set with add_header ONLY. Using `expires` as well would
    # emit a second, conflicting Cache-Control header.
    location /_astro/ {
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~* \.(?:woff2|woff|ttf|eot)$ {
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~* \.(?:png|jpe?g|gif|webp|avif|svg|ico)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    location = /sitemap-index.xml {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /robots.txt {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # ── PHASE 2 SEAM ─────────────────────────────────────────────────────────
    # decisions/0007-phase-boundaries.md
    # Uncomment when the API container exists, and activate the `api` service in
    # docker-compose.phase2.yml. Nothing else in this file changes.
    #
    # location /api/ {
    #     proxy_pass         http://api:4321;
    #     proxy_http_version 1.1;
    #     proxy_set_header   Host              $host;
    #     proxy_set_header   X-Real-IP         $remote_addr;
    #     proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header   X-Forwarded-Proto $scheme;
    #     proxy_set_header   Upgrade           $http_upgrade;
    #     proxy_set_header   Connection        "upgrade";
    #     proxy_read_timeout 60s;
    # }

    # ── Pages ────────────────────────────────────────────────────────────────
    # Astro builds with format:'directory', so /projects/foo resolves to
    # /projects/foo/index.html. The $uri.html fallback covers any flat pages.
    #
    # Cache-Control lives HERE, not in a `\.html$` location: requests arrive as
    # clean URLs like "/" and "/about", so a location matching the .html suffix
    # never fires for a page view and those responses would ship with no
    # Cache-Control at all. HTML must revalidate, or a deploy strands visitors on
    # a stale page referencing asset filenames that no longer exist.
    location / {
        try_files $uri $uri/index.html $uri.html $uri/ =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Never serve dotfiles.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
