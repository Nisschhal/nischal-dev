# Security headers, factored out and `include`d into every location block.
#
# WHY THE DUPLICATION: nginx's add_header is inherited by a child block ONLY if
# that block defines no add_header of its own. Any location that sets its own
# Cache-Control therefore silently drops every server-level header. Including
# this file in each such block is the standard fix — DO NOT "simplify" it by
# hoisting these to the server level and deleting the includes.

add_header X-Content-Type-Options "nosniff"                          always;
add_header X-Frame-Options        "DENY"                             always;
add_header Referrer-Policy        "strict-origin-when-cross-origin"  always;
add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;

# 'unsafe-inline' on script-src is required because Astro inlines small scripts
# into the HTML — which is why this site issues zero extra JS requests. Nonces
# would be stricter but cannot be generated from a static Nginx config.
# Acceptable here: the site is static, takes no user input, and has no auth.
# PHASE 2: with a Node server in front, switch to per-request nonces.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
