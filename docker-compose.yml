# Phase 1 stack: static site on Nginx + an ngrok tunnel.
# See decisions/0005-ngrok-in-compose.md
#
#   docker compose up --build      → site on http://localhost:8080
#                                    tunnel URL at http://localhost:4040

services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: nischal-portfolio:latest
    container_name: portfolio-web
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-8080}:80'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/healthz']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks: [portfolio]

  ngrok:
    image: ngrok/ngrok:latest
    container_name: portfolio-ngrok
    restart: unless-stopped
    # Targets web:80 on the internal network, NOT the published host port — so
    # WEB_PORT can change without touching the tunnel.
    #
    # On a paid plan with a reserved domain, add: --url=${NGROK_DOMAIN}
    command: http web:80 --log stdout
    environment:
      # `:?` fails fast with a readable message instead of a crash loop when the
      # token is missing. Get one at https://dashboard.ngrok.com/get-started/your-authtoken
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?set NGROK_AUTHTOKEN in .env — copy .env.example}
    ports:
      - '4040:4040' # inspector — shows the public URL and replays requests
    depends_on:
      web:
        condition: service_healthy
    networks: [portfolio]

networks:
  portfolio:
    driver: bridge
